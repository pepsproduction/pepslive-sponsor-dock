<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PepsLive Sponsor Dock</title>
  <script>
    (() => {
      const source = new URL(window.location.href);
      const mode = source.searchParams.get("mode") || "auto";
      const target = new URL(
        mode === "control" ? "./sponsor-control.html" : "./sponsor-display.html",
        source
      );
      for (const [key, value] of source.searchParams) {
        if (key === "mode" && mode === "control") continue;
        target.searchParams.set(key, value);
      }
      target.hash = source.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>กำลังเปิด PepsLive Sponsor Dock…</p>
</body>
</html>
