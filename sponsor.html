<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PepsLive Sponsor Control</title>
  <style>
    :root{
      --bg:#07080b;--card:#11131a;--card2:#171a23;--line:rgba(255,255,255,.12);
      --text:#f7f7fb;--muted:#aeb6c7;--orange:#ff7a18;--orange2:#ffb347;--cyan:#38e8ff;
      --danger:#ff3b5f;--ok:#4ade80;--radius:22px;--logoSize:120px;--gap:20px;--speed:12s;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}button,input,select{font:inherit}button{cursor:pointer}
    body.control{color:var(--text);background:radial-gradient(circle at 15% 8%,rgba(255,122,24,.28),transparent 30%),radial-gradient(circle at 90% 15%,rgba(56,232,255,.13),transparent 28%),linear-gradient(145deg,#07080b,#11131a 48%,#07080b)}
    .wrap{width:min(1280px,calc(100% - 28px));margin:auto;padding:22px 0 48px}.hero{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;padding:22px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(135deg,rgba(255,122,24,.18),rgba(255,255,255,.055));box-shadow:0 20px 70px rgba(0,0,0,.35)}
    .eyebrow{margin:0 0 6px;color:var(--orange2);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(30px,5vw,58px);line-height:.95}.hero p:last-child{margin:12px 0 0;color:var(--muted);line-height:1.55}.hero-actions,.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(17,19,26,.86);box-shadow:0 16px 56px rgba(0,0,0,.28);backdrop-filter:blur(16px)}.wide{grid-column:1/-1}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.head h2{margin:0 0 4px;font-size:19px}.head p{margin:0;color:var(--muted);line-height:1.5}.pill{display:inline-flex;align-items:center;min-height:30px;padding:6px 11px;border-radius:999px;background:rgba(255,122,24,.13);border:1px solid rgba(255,122,24,.35);color:#ffd6ba;font-weight:900;white-space:nowrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.07);color:var(--text);text-decoration:none;transition:.15s}.btn:hover{transform:translateY(-1px);border-color:rgba(255,122,24,.55);background:rgba(255,122,24,.12)}.primary{border:0;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#111;font-weight:950}.danger{border-color:rgba(255,59,95,.45);background:rgba(255,59,95,.12)}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;color:var(--muted);font-weight:800}input,select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.065);color:var(--text);padding:9px 11px;outline:none}select option{color:#111}input[type=range]{padding:0;accent-color:var(--orange)}.hint{margin-top:12px;padding:12px 14px;border:1px solid rgba(255,122,24,.18);border-radius:16px;background:rgba(255,122,24,.08);color:var(--muted);line-height:1.55}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mode{min-height:54px;border-radius:16px}.mode.active{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#111;border:0;font-weight:950}.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.logo-card{padding:12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.055)}.logo-card img{width:100%;height:82px;object-fit:contain;border-radius:12px;background:linear-gradient(45deg,rgba(255,255,255,.055) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.055) 25%,transparent 25%);background-size:16px 16px}.logo-card input{margin-top:8px}.mini{min-height:34px;padding:7px 11px;font-size:13px}.preview{aspect-ratio:16/9;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0b0d12}.preview iframe{width:100%;height:100%;border:0}.urlbox{display:grid;grid-template-columns:1fr auto;gap:8px}.switch{display:flex;gap:8px;align-items:center}.switch input{width:auto;min-height:auto}.status{color:var(--ok);font-weight:900}
    body.display{width:100vw;height:100vh;overflow:hidden;background:transparent}.stage{position:fixed;inset:0;overflow:hidden;color:white;background:transparent}.stage.with-bg{background:radial-gradient(circle at 20% 20%,rgba(255,122,24,.15),transparent 32%),rgba(0,0,0,.18)}.safe{position:absolute;inset:5.5%;border:2px dashed rgba(255,122,24,.35);border-radius:24px;display:none;z-index:20}.safe.on{display:block}.empty{position:absolute;left:50%;top:50%;translate:-50% -50%;padding:18px 24px;border-radius:24px;background:rgba(8,10,15,.75);border:1px solid rgba(255,122,24,.35);text-align:center;color:var(--muted)}.display-root{position:absolute;inset:0;display:grid;place-items:center;opacity:1;transition:.25s}.display-root.hide{opacity:0;transform:translateY(12px)}.tile{display:grid;place-items:center;padding:12px 16px;border-radius:var(--round,22px);background:rgba(10,12,18,.72);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 54px rgba(0,0,0,.38);backdrop-filter:blur(12px)}.tile img{width:var(--logoSize);height:calc(var(--logoSize)*.62);object-fit:contain}.tile span{margin-top:7px;font-weight:900;color:#fff;text-shadow:0 2px 12px #000;font-size:clamp(13px,1.3vw,22px)}.strip{display:flex;gap:var(--gap);align-items:center;justify-content:center;flex-wrap:wrap;width:min(92vw,1680px)}.pos-bottom{align-items:end;padding-bottom:52px}.pos-top{align-items:start;padding-top:52px}.pos-left{justify-items:start;padding-left:52px}.pos-right{justify-items:end;padding-right:52px}.ticker{position:absolute;left:0;right:0;bottom:48px;overflow:hidden}.ticker.top{top:48px;bottom:auto}.track{display:flex;gap:var(--gap);width:max-content;animation:ticker var(--speed) linear infinite}.paused .track{animation-play-state:paused}@keyframes ticker{to{transform:translateX(-50%)}}.gridmode{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--gap);width:min(88vw,1500px)}.one{animation:fadeIn .35s ease}@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}.bounce .tile{animation:bounce 2s ease-in-out infinite}.pulse .tile{animation:pulse 1.25s ease-in-out infinite}.spin .tile{animation:spin 4s linear infinite}.wiggle .tile{animation:wiggle 1.1s ease-in-out infinite}.float .tile{animation:float 3s ease-in-out infinite}.swing .tile{transform-origin:top center;animation:swing 2.4s ease-in-out infinite}.rain .tile{position:absolute;top:-180px;animation:rain var(--speed) linear infinite}.cover{display:flex;gap:calc(var(--gap)*.8);perspective:900px}.cover .tile:nth-child(odd){transform:rotateY(28deg) scale(.88)}.cover .tile:nth-child(even){transform:rotateY(-28deg) scale(.88)}.cover .tile:nth-child(3){transform:rotateY(0) scale(1.1);z-index:2}@keyframes bounce{50%{transform:translateY(-24px)}}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes wiggle{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}@keyframes float{50%{transform:translateY(-18px)}}@keyframes swing{25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}@keyframes rain{to{transform:translateY(125vh)}}
    @media(max-width:900px){.hero{align-items:stretch;flex-direction:column}.grid,.form{grid-template-columns:1fr}.modes{grid-template-columns:repeat(2,1fr)}.urlbox{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (()=>{
    const KEY='pepslive_sponsor_simple_v1', DB='PepsSponsorSimpleDB', STORE='logos', CH='pepslive_sponsor_simple_channel';
    const modes=['grid','rotator','ticker','bounce','rain','cover','pulse','spin','wiggle','float','swing'];
    const modeLabels={grid:'Grid',rotator:'Rotator',ticker:'Ticker',bounce:'Bounce',rain:'Rain',cover:'3D Cover',pulse:'Pulse',spin:'Spin',wiggle:'Wiggle',float:'Float',swing:'Swing'};
    const defaultState=()=>({logos:[],mode:'rotator',position:'bottom',size:130,gap:20,speed:10,round:22,showName:false,showBg:false,safe:false,visible:true,paused:false,index:0,cmd:0});
    let state=load(), urls=new Map(), timer=null;
    const q=new URLSearchParams(location.search); const isControl=q.get('mode')==='control'; document.body.className=isControl?'control':'display';
    function load(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return defaultState()}}
    function save(){localStorage.setItem(KEY,JSON.stringify(state)); bc({type:'state',state})}
    function bc(msg){try{const c=new BroadcastChannel(CH);c.postMessage(msg);c.close()}catch{}}
    function sub(fn){try{const c=new BroadcastChannel(CH);c.onmessage=e=>fn(e.data)}catch{} window.addEventListener('storage',e=>{if(e.key===KEY)fn({type:'state',state:load()})})}
    function uid(){return 'lg_'+Date.now()+'_'+Math.random().toString(16).slice(2)}
    function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
    async function putLogo(id,file){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({id,blob:file,name:file.name,type:file.type});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
    async function getLogo(id){if(urls.has(id))return urls.get(id);const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(id);r.onsuccess=()=>{const rec=r.result;if(!rec){res('');return}const u=URL.createObjectURL(rec.blob);urls.set(id,u);res(u)};r.onerror=()=>rej(r.error)})}
    async function delLogo(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
    async function clearLogos(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
    const esc=s=>String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
    const root=document.getElementById('app');
    if(isControl) renderControl(); else renderDisplay();

    async function renderControl(){
      root.innerHTML=`<div class="wrap"><header class="hero"><div><p class="eyebrow">PepsLive Sponsor</p><h1>Sponsor Control</h1><p>แนวใช้งานเร็วแบบ Jamornz: เพิ่มโลโก้ เลือกเอฟเฟกต์ ปรับขนาด แล้วเอา URL Display ไปใส่ OBS ได้เลย</p></div><div class="hero-actions"><a class="btn" target="_blank" href="${displayUrl()}">เปิด Display</a><button class="btn primary" id="sync">Sync Now</button></div></header><main class="grid"><section class="panel wide"><div class="head"><div><h2>1) เพิ่มโลโก้สปอนเซอร์</h2><p>ลากไฟล์หรือกดเพิ่มรูป PNG/JPG/WebP/SVG</p></div><label class="btn primary file">เพิ่มรูป<input id="files" type="file" accept="image/*" multiple></label></div><div id="logos" class="logos"></div></section><section class="panel"><div class="head"><div><h2>2) เลือกโหมดแสดงผล</h2><p>คลิกเลือกได้ทันที</p></div><span class="pill" id="count">0 Logos</span></div><div class="modes">${modes.map(m=>`<button class="btn mode ${state.mode===m?'active':''}" data-mode="${m}">${modeLabels[m]}</button>`).join('')}</div><div class="hint">โหมดแนะนำสำหรับงานกีฬา: <b>Ticker</b> ใช้วิ่งล่างจอ, <b>Rotator</b> โชว์ทีละเจ้า, <b>Grid</b> ใช้ช่วงพักครึ่ง</div></section><section class="panel"><div class="head"><div><h2>3) ปรับตำแหน่ง / ขนาด</h2><p>เหลือเฉพาะค่าที่จำเป็นหน้างาน</p></div></div><div class="form"><label>Position<select id="position"><option value="bottom">Bottom</option><option value="top">Top</option><option value="center">Center</option><option value="left">Left</option><option value="right">Right</option></select></label><label>Logo Size <input id="size" type="range" min="50" max="300" value="${state.size}"><span id="sizev"></span></label><label>Gap <input id="gap" type="range" min="0" max="80" value="${state.gap}"><span id="gapv"></span></label><label>Speed <input id="speed" type="range" min="3" max="40" value="${state.speed}"><span id="speedv"></span></label><label>Round <input id="round" type="range" min="0" max="60" value="${state.round}"><span id="roundv"></span></label><label class="switch"><input id="showName" type="checkbox"> Show Name</label><label class="switch"><input id="showBg" type="checkbox"> Test Background</label><label class="switch"><input id="safe" type="checkbox"> Safe Area</label></div></section><section class="panel"><div class="head"><div><h2>4) Live Control</h2><p>ปุ่มหลักที่ใช้ตอนออกอากาศ</p></div><span class="pill status" id="status">READY</span></div><div class="row"><button class="btn primary" id="show">Show</button><button class="btn" id="hide">Hide</button><button class="btn" id="prev">Prev</button><button class="btn" id="next">Next</button><button class="btn" id="pause">Pause</button><button class="btn danger" id="clear">Clear All</button></div><div class="hint">URL สำหรับ OBS Browser Source</div><div class="urlbox"><input id="url" value="${displayUrl()}" readonly><button class="btn primary" id="copy">Copy</button></div></section><section class="panel wide"><div class="head"><div><h2>Preview</h2><p>ดูหน้าตาคร่าว ๆ ก่อนใช้จริงใน OBS</p></div></div><div class="preview"><iframe src="${displayUrl()}&preview=1"></iframe></div></section></main></div>`;
      bindControl(); await renderLogoList();
    }
    function bindControl(){
      const $=id=>document.getElementById(id); $('position').value=state.position; $('showName').checked=state.showName; $('showBg').checked=state.showBg; $('safe').checked=state.safe;
      const upd=()=>{state.position=$('position').value;state.size=+$('size').value;state.gap=+$('gap').value;state.speed=+$('speed').value;state.round=+$('round').value;state.showName=$('showName').checked;state.showBg=$('showBg').checked;state.safe=$('safe').checked;labels();save()};
      function labels(){$('sizev').textContent=state.size+'px';$('gapv').textContent=state.gap+'px';$('speedv').textContent=state.speed+'s';$('roundv').textContent=state.round+'px'} labels();
      ['position','size','gap','speed','round','showName','showBg','safe'].forEach(id=>$(id).addEventListener('input',upd));
      document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();renderControl()});
      $('files').onchange=async e=>{for(const f of [...e.target.files]){const id=uid();await putLogo(id,f);state.logos.push({id,name:f.name.replace(/\.[^.]+$/,''),on:true})}e.target.value='';save();renderControl()};
      $('sync').onclick=()=>{state.cmd=Date.now();save();$('status').textContent='SYNCED'}; $('show').onclick=()=>{state.visible=true;save()}; $('hide').onclick=()=>{state.visible=false;save()}; $('next').onclick=()=>{state.index++;save()}; $('prev').onclick=()=>{state.index=Math.max(0,state.index-1);save()}; $('pause').onclick=()=>{state.paused=!state.paused;save();$('pause').textContent=state.paused?'Resume':'Pause'};
      $('copy').onclick=async()=>{await navigator.clipboard.writeText($('url').value);$('copy').textContent='Copied'};
      $('clear').onclick=async()=>{if(confirm('ลบโลโก้ทั้งหมด?')){await clearLogos();state=defaultState();save();renderControl()}};
    }
    async function renderLogoList(){
      const box=document.getElementById('logos'); document.getElementById('count').textContent=state.logos.length+' Logos';
      if(!state.logos.length){box.innerHTML='<div class="hint">ยังไม่มีโลโก้ เพิ่มรูปก่อน แล้วหน้า Display จะเริ่มทำงานทันที</div>';return}
      box.innerHTML='';
      for(const lg of state.logos){const u=await getLogo(lg.id);const el=document.createElement('div');el.className='logo-card';el.innerHTML=`<img src="${u}" alt=""><input value="${esc(lg.name)}"><div class="row" style="margin-top:8px"><button class="btn mini">${lg.on?'ON':'OFF'}</button><button class="btn mini danger">ลบ</button></div>`;const [name,on,del]=[el.querySelector('input'),...el.querySelectorAll('button')];name.oninput=()=>{lg.name=name.value;save()};on.onclick=()=>{lg.on=!lg.on;save();renderLogoList()};del.onclick=async()=>{await delLogo(lg.id);state.logos=state.logos.filter(x=>x.id!==lg.id);save();renderLogoList()};box.appendChild(el)}
    }
    function displayUrl(){return new URL('sponsor.html?mode=display',location.href).href}

    async function renderDisplay(){
      root.innerHTML='<main class="stage"><div class="safe"></div><section class="display-root"></section></main>'; sub(msg=>{if(msg?.state){state=Object.assign(defaultState(),msg.state);draw()}}); await draw();
    }
    async function draw(){
      document.documentElement.style.setProperty('--logoSize',state.size+'px');document.documentElement.style.setProperty('--gap',state.gap+'px');document.documentElement.style.setProperty('--speed',state.speed+'s');document.documentElement.style.setProperty('--round',state.round+'px');
      const stage=document.querySelector('.stage'), safe=document.querySelector('.safe'), out=document.querySelector('.display-root'); stage.classList.toggle('with-bg',!!state.showBg);safe.classList.toggle('on',!!state.safe||q.get('preview')==='1');out.className='display-root '+(state.visible?'':'hide')+' pos-'+state.position;
      const logos=state.logos.filter(x=>x.on!==false); if(!logos.length){out.innerHTML='<div class="empty"><b>PepsLive Sponsor</b><br>ยังไม่มีโลโก้</div>';return}
      if(state.mode==='ticker')return drawTicker(logos,out); if(state.mode==='rotator')return drawRotator(logos,out); if(state.mode==='rain')return drawRain(logos,out); if(state.mode==='cover')return drawSet(logos.slice(0,5),out,'cover'); if(['bounce','pulse','spin','wiggle','float','swing'].includes(state.mode))return drawSet(logos.slice(0,6),out,'strip '+state.mode); return drawSet(logos,out,'gridmode');
    }
    async function tile(lg){const u=await getLogo(lg.id);return `<article class="tile"><img src="${u}" alt="">${state.showName?`<span>${esc(lg.name)}</span>`:''}</article>`}
    async function drawSet(logos,out,cls){const html=[];for(const lg of logos)html.push(await tile(lg));out.innerHTML=`<div class="${cls}">${html.join('')}</div>`}
    async function drawTicker(logos,out){const arr=[...logos,...logos,...logos];const html=[];for(const lg of arr)html.push(await tile(lg));out.innerHTML=`<div class="ticker ${state.position==='top'?'top':''} ${state.paused?'paused':''}"><div class="track">${html.join('')}</div></div>`}
    async function drawRotator(logos,out){const i=((state.index%logos.length)+logos.length)%logos.length;out.innerHTML='<div class="one">'+await tile(logos[i])+'</div>';clearTimeout(timer);if(!state.paused)timer=setTimeout(()=>{state.index++;draw()},Math.max(1500,state.speed*1000))}
    async function drawRain(logos,out){let html='';let n=Math.min(14,logos.length*3);for(let i=0;i<n;i++){const lg=logos[i%logos.length];const left=Math.random()*92;const delay=Math.random()*-state.speed;html+=`<div style="left:${left}vw;animation-delay:${delay}s">${await tile(lg)}</div>`}out.innerHTML=`<div class="rain">${html}</div>`}
  })();
  </script>
</body>
</html>
